        <h1>InvisioVault - Secure File Hiding, Universal Polyglot &amp; Steganography</h1>
        <p>InvisioVault is an advanced, privacy-focused steganography and polyglot utility crafted by Rolan (RNR). It enables hiding any file within carrier formats with zero visual degradation and robust password protection.</p>
        
        <h2>Core Capabilities</h2>
        <ul>
          <li><strong>Universal Polyglot Files:</strong> Hide archives within any carrier format (images, PDFs, MP3s, MP4s, ZIPs) using automatic offset patching.</li>
          <li><strong>Edge-Guided LSB Steganography:</strong> Embed data into high-entropy image textures using Sobel edge detection and Reed-Solomon error correction.</li>
          <li><strong>Encrypted QR Code Steganography:</strong> Embed authenticated Fernet-encrypted hidden payloads inside scannable QR codes.</li>
          <li><strong>Zero-Server Storage:</strong> Stateless memory processing where files are instantly cleaned up after processing.</li>
        </ul>
